<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VACA VIDEO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  #cow-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }


</style>
</head>
<body>

<div id="stage">
  <video id="cow-video" playsinline webkit-playsinline preload="auto" autoplay muted loop>
    <source src="img/VACA.mp4" type="video/mp4">
  </video>
</div>

<script>
  const video = document.getElementById('cow-video');

  // 'muted' lives on the HTML element itself so the browser's own
  // autoplay always succeeds immediately, with no JS race. Sound is
  // enabled on the first real user gesture. Browsers only count
  // 'click', 'touchend' and 'keydown' as valid gestures for that;
  // 'pointerdown'/'touchstart' don't qualify and can even interrupt
  // playback if used to call play().
  function unmuteOnFirstInteraction() {
    const onFirstInteraction = () => {
      video.muted = false;
      video.play().catch(() => {});
      document.removeEventListener('click', onFirstInteraction);
      document.removeEventListener('touchend', onFirstInteraction);
      document.removeEventListener('keydown', onFirstInteraction);
    };
    document.addEventListener('click', onFirstInteraction);
    document.addEventListener('touchend', onFirstInteraction);
    document.addEventListener('keydown', onFirstInteraction);
  }

  // Safety net: if anything ever pauses the video (stray gesture, OS
  // media-session interruption, etc.), resume playback immediately.
  video.addEventListener('pause', () => {
    if (!video.ended) video.play().catch(() => {});
  });

  video.play().catch(() => {});
  unmuteOnFirstInteraction();
</script>

</body>
</html>
