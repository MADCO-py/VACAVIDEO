<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VACA VIDEO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  #cow-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  #play-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.25s ease;
  }

  #play-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #play-button {
    width: 22vw;
    height: 22vw;
    max-width: 140px;
    max-height: 140px;
    min-width: 84px;
    min-height: 84px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #play-overlay:hover #play-button {
    background: rgba(255, 255, 255, 0.22);
    transform: scale(1.05);
  }

  #play-button svg {
    width: 42%;
    height: 42%;
    margin-left: 6%;
    fill: #fff;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="cow-video" playsinline webkit-playsinline preload="auto">
    <source src="img/VACA.mp4" type="video/mp4">
  </video>

  <div id="play-overlay">
    <div id="play-button">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('cow-video');
  const overlay = document.getElementById('play-overlay');

  function startVideo() {
    video.muted = false;
    video.currentTime = 0;
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        video.muted = true;
        video.play();
      });
    }
    overlay.classList.add('hidden');
  }

  overlay.addEventListener('click', startVideo);

  video.addEventListener('ended', () => {
    overlay.classList.remove('hidden');
  });
</script>

</body>
</html>
