<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VACA VIDEO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  #cow-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  #sound-hint {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8vh;
    pointer-events: none;
  }

  #sound-hint.visible {
    display: flex;
  }

  #sound-hint span {
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font: 14px/1 -apple-system, system-ui, sans-serif;
    padding: 10px 16px;
    border-radius: 999px;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="cow-video" playsinline webkit-playsinline preload="auto" autoplay loop>
    <source src="img/VACA.mp4" type="video/mp4">
  </video>

  <div id="sound-hint"><span>Toca para activar el sonido</span></div>
</div>

<script>
  const video = document.getElementById('cow-video');
  const hint = document.getElementById('sound-hint');

  function unmute() {
    video.muted = false;
    hint.classList.remove('visible');
  }

  function armFirstTouchUnmute() {
    hint.classList.add('visible');
    const onFirstInteraction = () => {
      unmute();
      video.play();
      document.removeEventListener('pointerdown', onFirstInteraction);
      document.removeEventListener('touchstart', onFirstInteraction);
      document.removeEventListener('keydown', onFirstInteraction);
    };
    document.addEventListener('pointerdown', onFirstInteraction);
    document.addEventListener('touchstart', onFirstInteraction);
    document.addEventListener('keydown', onFirstInteraction);
  }

  video.muted = false;
  const attempt = video.play();

  if (attempt !== undefined) {
    attempt.catch(() => {
      video.muted = true;
      video.play().catch(() => {});
      armFirstTouchUnmute();
    });
  }
</script>

</body>
</html>
